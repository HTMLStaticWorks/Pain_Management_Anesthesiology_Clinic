<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (localStorage.getItem('rtl') === 'true') {
      document.documentElement.setAttribute('dir', 'rtl');
    }
  </script>
  <title>Login - ApexPain Management & Anesthesiology Clinic</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#081018',
            cardbg1: '#0D1B2A',
            cardbg2: '#132337',
            primary: '#0D9488',
            secondary: '#0284C7',
            accent: '#14B8A6',
            violet: {
              400: '#0D9488',
              500: '#0F766E',
              600: '#0284C7',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            heading: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <style>
    .neon-focus:focus {
      border-color: #0284C7;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body class="bg-[#081018] text-[#F8FAFC] min-h-screen flex items-center justify-center relative overflow-hidden pt-20 pb-8 md:py-8">

  <!-- Header Style Action Controls (Top Right) -->
  <div class="absolute top-4 right-4 z-50 flex items-center gap-3">
    <!-- Theme Toggle Switch Button -->
    <button id="theme-toggle" class="header-theme-switch" title="Toggle Theme">
      <span class="track-icons flex justify-between items-center text-xs select-none w-full">
        <i class="fa-regular fa-moon text-sky-400 text-xs opacity-75"></i>
        <i class="fa-regular fa-sun text-amber-400 text-xs opacity-75"></i>
      </span>
      <span id="header-theme-thumb">
        <i id="theme-icon" class="fa-regular fa-sun text-white"></i>
      </span>
    </button>

    <!-- RTL/LTR Toggle Button -->
    <button id="rtl-toggle" class="w-[38px] h-[38px] flex items-center justify-center rounded-full border border-gray-800 hover:bg-gray-800 text-gray-300 hover:text-white transition-colors bg-transparent" title="Toggle Layout Direction">
      <i id="rtl-icon" class="fa-solid fa-right-left text-sm"></i>
    </button>
  </div>

  <!-- Background Orbs -->
  <div class="bg-gradient-orb orb-primary -top-12 -left-12"></div>
  <div class="bg-gradient-orb orb-secondary -bottom-12 -right-12"></div>

  <!-- Glass Form Container -->
  <main class="w-full max-w-md px-6 relative z-10">
    <div class="glass-panel auth-card p-8 rounded-3xl space-y-6">
      
      <!-- Logo Header -->
      <div class="text-center space-y-2">
        <a class="brand-logo flex items-center justify-center gap-2 tracking-wider text-decoration-none" href="index.html">
          <i class="fa-solid fa-heart-pulse text-[#2DD4BF] text-xl"></i>
          <span>APEX<span class="text-[#0D9488]">PAIN</span></span>
        </a>
        <p class="text-xs text-[#94A3B8]">Access your patient portal</p>
      </div>

      <!-- Form -->
      <form class="space-y-4" onsubmit="event.preventDefault(); location.href='dashboard.html';">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#94A3B8] mb-1">Email address</label>
          <input type="email" required autocomplete="off" placeholder="" class="w-full px-4 py-2.5 rounded-xl bg-[#081018]/60 border border-gray-800 text-white text-xs placeholder-gray-500 focus:outline-none neon-focus transition-all">
        </div>
        <div class="relative">
          <label class="block text-[10px] uppercase tracking-widest text-[#94A3B8] mb-1">Password</label>
          <div class="relative">
            <input id="password-input" type="password" required autocomplete="off" placeholder="" class="w-full px-4 py-2.5 rounded-xl bg-[#081018]/60 border border-gray-800 text-white text-xs placeholder-gray-500 focus:outline-none neon-focus transition-all pr-10">
            <button type="button" onclick="togglePasswordVisibility()" class="password-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors text-xs">
              <i id="password-eye" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-remember-forgot flex justify-between items-center text-xs text-[#94A3B8] font-sans h-5">
          <label class="flex items-center gap-2 cursor-pointer font-sans text-xs text-[#94A3B8] font-normal m-0 leading-normal h-full">
            <input type="checkbox" class="rounded bg-[#081018] border-gray-800 text-[#0D9488] focus:ring-0">
            <span class="text-xs text-[#94A3B8] font-normal leading-normal">Remember me</span>
          </label>
          <a href="#" class="text-xs text-[#94A3B8] hover:text-[#0D9488] transition-colors text-decoration-none font-normal leading-normal h-full flex items-center">Forgot password?</a>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-[#0D9488] hover:bg-[#0D9488]/90 transition-all font-medium text-xs uppercase tracking-wider text-white">
          Log In
        </button>
      </form>

      <!-- Social Logins -->
      <div class="space-y-4">
        <div class="flex items-center gap-2">
          <div class="h-[1px] bg-gray-800 flex-1"></div>
          <span class="text-[9px] uppercase tracking-widest text-gray-600">Or connect with</span>
          <div class="h-[1px] bg-gray-800 flex-1"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button onclick="location.href='dashboard.html';" class="social-login-btn google-btn py-2.5 rounded-xl border border-gray-800 hover:border-gray-650 transition-colors flex items-center justify-center gap-2 text-xs text-white">
            <i class="fa-brands fa-google text-red-500"></i> Google
          </button>
          <button onclick="location.href='dashboard.html';" class="social-login-btn apple-btn py-2.5 rounded-xl border border-gray-800 hover:border-gray-650 transition-colors flex items-center justify-center gap-2 text-xs text-white">
            <i class="fa-brands fa-apple text-white"></i> Apple
          </button>
        </div>
      </div>

      <!-- Registration link -->
      <div class="text-center text-xs text-[#94A3B8] pt-2">
        Don't have an account? <a href="register.html" class="text-[#0284C7] hover:underline text-decoration-none font-medium">Register here</a>
      </div>

    </div>
  </main>

  <!-- Back to top button -->
  <button id="back-to-top" class="back-to-top" title="Back to top" aria-label="Scroll to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('password-input');
      const eye = document.getElementById('password-eye');
      if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        eye.className = 'fa-regular fa-eye';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
